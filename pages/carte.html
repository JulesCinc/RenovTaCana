<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenovTaCana - Carte</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Feuille de style -->
    <link rel="stylesheet" href="../css/code.css">
</head>

<script src="../js/search.js"></script>

<body>

    <!-- =========================
         HEADER
         ========================= -->
    <header class="site-header site-header--map">
        <div class="site-header__left">
            <img src="../assets/images/logo_entreprise.png" alt="Logo Métropole Nice Côte d’Azur"
                class="site-header__logo">

            <a href="../index.html" class="header-home">
                <img src="../assets/icons/accueil.png" alt="Accueil">
            </a>
        </div>

        <!-- Barre de recherche dans le header -->
        <div class="site-header__center">
            <form class="search-bar search-bar--header" action="adresses.html" method="get">
                <button class="search-bar__icon-button" aria-label="Rechercher">
                    <img src="../assets/icons/chercher.svg" alt="" class="search-bar__icon">
                </button>
                <input type="text" name="adresse" class="search-bar__input" placeholder="Entrer une adresse"
                    aria-label="Entrer une adresse">
                <button type="button" class="search-bar__icon-button search-bar__clear-button" aria-label="Effacer">
                    <img src="../assets/icons/croix.svg" alt="" class="search-bar__icon search-bar__icon--small">
                </button>
                <form>
        </div>
        </div>

        <div class="site-header__right">
            <h1 class="site-header__title">RenovTaCana</h1>
        </div>
    </header>

    <!-- =========================
         ZONE CARTE
         ========================= -->
    <main class="map-page">
        <section class="map-container">

            <!-- Image temporaire en attendant la vraie heatmap -->
            <img src="../assets/images/heatmap_prototype.png" alt="Prototype de carte heatmap"
                class="map-container__image">

            <!-- Légende criticité -->
            <aside class="map-legend" aria-label="Légende de criticité">
                <div class="map-legend__arrow map-legend__arrow--top"></div>

                <div class="map-legend__scale">
                    <div class="map-legend__gradient"></div>

                    <div class="map-legend__labels">
                        <span>100%</span>
                        <span>50%</span>
                        <span>0%</span>
                    </div>
                </div>

                <div class="map-legend__arrow map-legend__arrow--bottom"></div>
            </aside>

            <!-- Barre d’échelle -->
            <div class="map-scale">
                <div class="map-scale__labels">
                    <span>1000 m</span>
                    <span>500 m</span>
                    <span>0</span>
                    <span>1 km</span>
                </div>

                <div class="map-scale__bar">
                    <div class="map-scale__segment map-scale__segment--dark"></div>
                    <div class="map-scale__segment map-scale__segment--light"></div>
                    <div class="map-scale__segment map-scale__segment--dark"></div>
                    <div class="map-scale__segment map-scale__segment--light"></div>
                    <div class="map-scale__segment map-scale__segment--dark"></div>
                    <div class="map-scale__segment map-scale__segment--light"></div>
                </div>
            </div>

            <!-- Boutons zoom -->
            <div class="map-zoom">
                <button class="map-zoom__button" aria-label="Zoom arrière">−</button>
                <button class="map-zoom__button" aria-label="Zoom avant">+</button>
            </div>

        </section>
    </main>

</body>

</html>
